# Supabase 무료 플랜은 7일간 요청이 없으면 프로젝트가 일시정지됩니다. 3일마다 가벼운 쿼리를 보내 방지합니다.
name: Supabase keep-alive
on:
  schedule: [{ cron: '17 1 */3 * *' }]   # 3일마다 01:17 UTC (10:17 KST)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -f "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/config?select=key&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" > /dev/null && echo "pinged"
